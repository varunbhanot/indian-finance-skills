# TEST DATA, NOT STATUTORY FACT (ADR 0009). This is `rules/fy2026-27.yaml`
# with `groups.epf.employer_components` removed and nothing else changed: a
# rules file that predates the employer-contribution reading, to show that the
# same decoder reads it without the reading and without a rejection. Do not
# copy any value out of this file; take it from `rules/`.
# Statutory rules for financial year 2026-27 (assessed in AY 2027-28).
#
# Shape (ADR 0001, ADR 0008):
#   financial_year: the FY this file covers; must match the filename.
#   groups:         a map of named groups. Every value lives inside a group,
#                   and every group carries `source` (primary-source URL) and
#                   `retrieved` (YYYY-MM-DD), plus optional `effective_from`
#                   and `effective_to` dates.
#
# Rates are written as decimal fractions (`rate: 0.05`, never `500`) under a
# key named `rate` or ending in `_rate`; the loader converts them to integer
# basis points and refuses more precision than basis points can hold (ADR 0002).
#
# Groups are added by the ticket that sources them.
financial_year: 2026-27
groups:
  # The catalogue of offer-letter component types (ADR 0004). Each entry
  # classifies a component on the two axes -- `certainty` (guaranteed /
  # conditional-on-performance / conditional-on-tenure / conditional-on-liquidity)
  # and `form` (cash-now / deferred-cash / locked-savings / equity /
  # benefit-in-kind) -- plus a `recurring` flag, and `instrument` for an equity
  # type. Guaranteed recurring cash is derived from the first three (guaranteed
  # and cash-now and recurring), never listed here.
  #
  # Adding a component type is a change to this group alone; the decoder
  # classifies whatever entries it finds.
  #
  # The group's source is what names these components as parts of a pay packet:
  # section 2(y) of the Code on Wages defines wages and lists what an employer
  # pays beside them -- house rent allowance, a travelling concession, bonus,
  # commission, gratuity, and the employer's contribution to a provident or
  # pension fund. It does not settle where any of them sits on the two axes, so
  # every entry states its own basis and none inherits this one (ADR 0010):
  # `source` when a statute settles the classification, `rationale` when the
  # author does.
  components:
    title: The Code on Wages, 2019 (No. 29 of 2019)
    source: https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf
    retrieved: 2026-09-05
    entries:
      basic:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          The base component of the salary structure, payable monthly under the
          terms of employment whatever the employee or the employer achieves.
      hra:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          Paid with monthly salary as part of the fixed structure. Its exemption
          from tax is conditional on rent paid; the payment itself is not.
      special_allowance:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          The residual monthly allowance that balances a structure to its agreed
          fixed pay, and is paid unconditionally like the rest of it.
      lta:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          Budgeted in the annual fixed structure and paid to the employee whether
          or not it is claimed against travel, being taxable when unclaimed. The
          travel and the bills condition the exemption, not the payment.
      # Sections 5 and 6: the employer's contribution is paid into a fund framed
      # under the Act, not to the employee, so it is savings the employee cannot
      # reach now.
      employer_pf:
        certainty: guaranteed
        form: locked-savings
        recurring: true
        title: The Employees' Provident Funds and Miscellaneous Provisions Act, 1952 (No. 19 of 1952)
        source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
      # Section 4(1): gratuity is payable only on termination of employment, and
      # only after not less than five years of continuous service -- conditional
      # on tenure, and deferred until the employment ends.
      gratuity:
        certainty: conditional-on-tenure
        form: deferred-cash
        recurring: true
        title: The Payment of Gratuity Act, 1972 (No. 39 of 1972)
        source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
      # Section 2(i): the National Pension System accumulates contributions in an
      # individual pension account, so an employer contribution to it is savings
      # rather than cash the employee receives.
      employer_nps:
        certainty: guaranteed
        form: locked-savings
        recurring: true
        title: The Pension Fund Regulatory and Development Authority Act, 2013 (No. 23 of 2013)
        source: https://www.pfrda.org.in/documents/33652/103065/PFRDA+Act+-+2013.pdf
      variable_pay:
        certainty: conditional-on-performance
        form: cash-now
        recurring: true
        rationale: >-
          Quoted at a target and paid against an assessment of performance, so
          neither its occurrence nor its amount is settled by the letter. It is
          offered each year, and it is cash in the year it is paid.
      joining_bonus:
        certainty: guaranteed
        form: cash-now
        recurring: false
        rationale: >-
          Promised unconditionally for joining, paid in cash, and paid once.
      relocation:
        certainty: guaranteed
        form: cash-now
        recurring: false
        rationale: >-
          Paid or reimbursed once for the move itself, and not repeated in later
          years.
      retention_bonus:
        certainty: conditional-on-tenure
        form: cash-now
        recurring: false
        rationale: >-
          Paid once, and only if the employee is still in service on the date the
          letter names.
      insurance_premium:
        certainty: guaranteed
        form: benefit-in-kind
        recurring: true
        rationale: >-
          A premium the employer pays to an insurer every year. The employee
          receives cover, and never the money.
      meal_card:
        certainty: guaranteed
        form: benefit-in-kind
        recurring: true
        rationale: >-
          Loaded each month onto an instrument that can only be spent on meals,
          so the employee receives a benefit rather than cash.
      # The three equity instruments (ADR 0005). `instrument` is what tells the
      # decoder which valuation applies; none of these entries says what a grant
      # is worth, and none says how any employer vests one -- the schedule is
      # typed from the letter.
      rsu:
        certainty: conditional-on-tenure
        form: equity
        instrument: rsu
        recurring: false
        rationale: >-
          A promise of shares delivered as the grant vests, so an employee who
          leaves before a vesting date receives nothing for that year. One award
          spread over the years its schedule names, rather than a sum offered
          again each year.
      stock_option:
        certainty: conditional-on-tenure
        form: equity
        instrument: option
        recurring: false
        rationale: >-
          A right to buy at a fixed strike price, exercisable only over the part
          of the grant that has vested. Whether exercising it is worth anything
          is a second question the strike settles, and the letter settles
          neither.
      espp:
        certainty: guaranteed
        form: equity
        instrument: espp
        recurring: true
        rationale: >-
          A standing right to buy shares at a discount, offered each cycle and
          conditional on nothing but participation. The employee funds the
          purchase out of pay already counted elsewhere in the package.

  # Income tax under the new regime, for tax year 2026-27.
  #
  # The Income-tax Act, 2025 (No. 30 of 2025) came into force on 1 April 2026
  # and repealed the Income-tax Act, 1961 (section 536(1)), so the section
  # numbers CONTEXT.md's glossary grew up with -- 115BAC, 87A, 16(ia), 288A,
  # 288B -- name a repealed Act and appear nowhere in this file.
  #
  # Two Acts are in play and the split is not the obvious one. The *rate table*
  # for the new regime lives in the Income-tax Act itself (section 202(1)); the
  # Finance Act, 2026 only charges tax "at the rates specified" and carries the
  # OLD regime's table in Part I-B of its First Schedule. The cess, by contrast,
  # is imposed by the Finance Act and must be re-sourced every year.
  income_tax:
    title: The Income-tax Act, 2025 (No. 30 of 2025)
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    new_regime:
      slabs:
        section: Income-tax Act, 2025, section 202(1) Table ("New tax regime for individuals, Hindu undivided family and others")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Charged for tax year 2026-27 by the Finance Act, 2026, section 3(1),
          which refers to these rates rather than restating them. Finance Act,
          2026, section 56 is its only amendment to section 202 and touches
          sub-section (2)(a)(iii) alone, leaving this table untouched. The Act
          states the table as band and rate without spelling out the marginal
          arithmetic; it is read as a slab table, which is how the Income Tax
          Department's own calculation engine applies it.
        bands:
          - upto: 400000
            rate: 0.00
          - upto: 800000
            rate: 0.05
          - upto: 1200000
            rate: 0.10
          - upto: 1600000
            rate: 0.15
          - upto: 2000000
            rate: 0.20
          - upto: 2400000
            rate: 0.25
          # Sl. No. 7, "Above 24,00,000": the final band has no upper bound.
          - rate: 0.30
      standard_deduction:
        section: Income-tax Act, 2025, section 19(1) Table Sl. No. 2(a) ("Deductions from salaries")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          "75000 or the salary, whichever is less, where income-tax is computed
          under section 202(1)" -- so it is capped at the salary it is deducted
          from. Section 202(2)(a) disallows only Sl. No. 1 of the same table,
          which is the tax on employment, so the standard deduction survives in
          the new regime.
        amount: 75000
      rebate:
        section: Income-tax Act, 2025, section 156(2) and (3) ("Rebate of income-tax in case of certain individuals")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Available to a resident individual only. Section 156(2)(b) also gives
          marginal relief where total income exceeds twelve lakh rupees, which
          this decoder does not yet compute, so the figures above the threshold
          are the pre-relief ones.
        total_income_threshold: 1200000
        maximum: 60000
      # Surcharge under the new regime (spec #12). Where it comes from is not
      # where the old regime's comes from, and the split is deliberate in the
      # Act: section 3(1) charges tax at the Part I-B rates "increased by a
      # surcharge ... in the manner provided therein" -- that is Part I-B's own
      # Paragraph F, which the old regime below reads. Income chargeable under
      # section 202 does not go down that path at all. Section 202 sits in
      # Chapter XIII Part C ("New tax regime") of the Income-tax Act, 2025, so
      # it falls inside section 3(3) of the Finance Act, whose surcharge is set
      # by section 3(4)(b); and section 3(4)(a)(ii) then excludes section 202
      # persons from Paragraph F by name. Hence: new regime here, old regime
      # under Paragraph F.
      surcharge:
        title: The Finance Act, 2026 (No. 4 of 2026)
        section: Finance Act, 2026 (No. 4 of 2026), section 3(4)(b) Table Sl. No. 10, read with section 3(3) and section 3(4)(a)(ii)
        source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
        retrieved: 2026-09-05
        note: >-
          These bands are clauses (i) to (iii) of column D. The new regime's
          table stops at 25%: it carries no 37% band, which is where it differs
          from the old regime's Paragraph F table. Clauses (iii) to (v) turn on
          whether the total income includes dividend income or capital gains
          under sections 196, 197 and 198, and clause (v) caps the surcharge on
          that part of the income at 15%; a salary-only total income has none of
          it, so clause (iii) is read here on the whole figure and clauses (iv)
          and (v) do not arise. A figure computed from these bands is therefore
          right only for a total income with no dividend income and no such
          capital gains in it.
        bands:
          - clause: (i)
            above: 5000000
            upto: 10000000
            rate: 0.10
          - clause: (ii)
            above: 10000000
            upto: 20000000
            rate: 0.15
          # "exceeds 20000000": the final band has no upper bound.
          - clause: (iii)
            above: 20000000
            rate: 0.25
    # Old regime, for tax year 2026-27 (spec #11). Unlike the new regime, this
    # rate table does NOT live in the Income-tax Act, 2025 itself -- it lives in
    # Part I-B of the Finance Act, 2026's First Schedule, an original enactment
    # for this tax year rather than an amendment of anything, and so must be
    # re-sourced every year exactly as the cess below is.
    #
    # Part I-B carries three separate tables banded by age: item (I) (below 60,
    # resident or non-resident, and every non-resident individual regardless of
    # age since items (II)-(III) are each limited to residents), item (II)
    # (resident, 60 to under 80) and item (III) (resident, 80 or more). This
    # file encodes item (I) only; the below-60 assumption this rests on is named
    # in the take-home output (spec #11), and the other two bands are left out
    # rather than guessed at.
    old_regime:
      slabs:
        title: The Finance Act, 2026 (No. 4 of 2026)
        section: Finance Act, 2026 (No. 4 of 2026), First Schedule, Part I-B, Paragraph A, item (I) ("In the case of every individual other than the individual referred to in items (II) and (III) of this Paragraph...")
        source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
        retrieved: 2026-09-05
        note: >-
          Item (I) of three age-banded tables in Part I-B: this is the table for
          individuals below 60 (resident or non-resident) and for every
          non-resident individual whatever their age, since items (II) (resident,
          60 to under 80) and item (III) (resident, 80 or more) are each limited
          to residents. Those two tables carry higher exemptions and are not
          encoded here. "12500 plus 20% of the amount by which the total income
          exceeds 500000" and "112500 plus 30% of the amount by which the total
          income exceeds 1000000" are the cumulative tax at the start of bands 3
          and 4 stated as constants, which is the same arithmetic a slab table
          gives when walked band by band -- 5% of the 250000-500000 band is
          exactly 12500, and adding 20% of the 500000-1000000 band gives exactly
          112500 -- so it is read as a slab table here too.
        bands:
          - upto: 250000
            rate: 0.00
          - upto: 500000
            rate: 0.05
          - upto: 1000000
            rate: 0.20
          # Sl. No. (4), "where the total income exceeds 1000000": the final
          # band has no upper bound.
          - rate: 0.30
      standard_deduction:
        section: Income-tax Act, 2025, section 19(1) Table Sl. No. 2(b) ("Deductions from salaries")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          "50000 or the salary, whichever is less, in any other case" -- "any
          other case" being every case other than section 202(1), i.e. the old
          regime. Capped at the salary it is deducted from, as the new regime's
          standard deduction is.
        amount: 50000
      rebate:
        section: Income-tax Act, 2025, section 156(1) ("Rebate of income-tax in case of certain individuals")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Available to a resident individual only, same as the new regime's
          rebate at section 156(2)-(3), but this is the plain subsection: it
          carries no reference to section 202(1) at all, unlike (2) and (3),
          which each tie themselves explicitly to total income "chargeable to
          tax under section 202(1)". Unlike the new regime's rebate, section
          156(1) gives no marginal relief for total income just above the
          threshold: crossing five lakh rupees by even one rupee loses the whole
          rebate on the face of this text.
        total_income_threshold: 500000
        maximum: 12500
      # Surcharge under the old regime (spec #12), from Part I-B's own
      # Paragraph F, which is what section 3(1) means by "in the manner provided
      # therein". Paragraph F opens on "the amount of income-tax computed in
      # accordance with Paragraphs A to E" -- Paragraph A being the old regime's
      # rate table above -- so this is the table for income charged at those
      # rates, and section 202 income is routed elsewhere (see the new regime's
      # surcharge above).
      surcharge:
        title: The Finance Act, 2026 (No. 4 of 2026)
        section: Finance Act, 2026 (No. 4 of 2026), First Schedule, Part I-B, Paragraph F, Table 1, Sl. No. 1
        source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
        retrieved: 2026-09-05
        note: >-
          Clauses (i) to (iv) of column C. Unlike the new regime's table this one
          still carries a 37% band above five crore rupees. Clauses (iii) to (vi)
          turn on whether the total income includes dividend income or capital
          gains under sections 196, 197 and 198, and clause (vi) caps the
          surcharge on that part of the income at 15%; a salary-only total income
          has none of it, so clauses (iii) and (iv) are read here on the whole
          figure and clauses (v) and (vi) do not arise. A figure computed from
          these bands is therefore right only for a total income with no dividend
          income and no such capital gains in it. The Income Tax Department's own
          calculation engine applies 25% rather than 37% above five crore rupees
          under the old regime; that is the engine departing from Paragraph F,
          and this file follows the Paragraph.
        bands:
          - clause: (i)
            above: 5000000
            upto: 10000000
            rate: 0.10
          - clause: (ii)
            above: 10000000
            upto: 20000000
            rate: 0.15
          - clause: (iii)
            above: 20000000
            upto: 50000000
            rate: 0.25
          # "exceeds 50000000": the final band has no upper bound.
          - clause: (iv)
            above: 50000000
            rate: 0.37
    # Marginal relief on the surcharge, for a total income that has just crossed
    # a surcharge band's threshold (spec #12). One rule, enacted twice because
    # the two regimes are charged down two different paths: section 3(5) for
    # income chargeable under section 202, and Part I-B Paragraph F's own Table 2
    # for income charged at the Paragraph A rates. The two are word-for-word the
    # same formula under different variable letters -- Tn = Rn + Sn there,
    # Wn = Un + Vn here -- so they are carried as one rule with one statement,
    # and the thresholds they measure from are not repeated: each table's column
    # C amounts are exactly the `above` figures of that regime's own surcharge
    # bands above, checked row by row for both regimes on the retrieval date.
    marginal_relief:
      # One rule enacted twice, because the two regimes are charged down two
      # different paths -- so each regime cites its own provision rather than
      # both carrying a citation naming the other's. The two are word for word
      # the same formula under different variable letters, Tn = Rn + Sn against
      # Wn = Un + Vn.
      #
      # Neither relief table's column C amounts are repeated here: they are
      # exactly the `above` figures of that regime's own surcharge bands, and
      # the core reads them from there. Checked row for row on the retrieval
      # date -- new regime 50/100/200 lakh against bands above 50/100/200 lakh,
      # old regime 50/100/200/500 lakh against bands above 50/100/200/500 lakh,
      # with nothing missing from either side and nothing extra. A year in which
      # they diverge is a year that needs its own thresholds encoded here, and a
      # change to the core to read them (ADR 0014).
      new_regime:
        title: The Finance Act, 2026 (No. 4 of 2026)
        section: Finance Act, 2026 (No. 4 of 2026), section 3(5), and its Table Sl. No. 6 ("Persons specified against Sl. Nos. 10 and 11 in column C")
        source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
        retrieved: 2026-09-05
        note: >-
          "the total amount payable as income-tax and surcharge thereon shall not
          exceed the amount determined as per the following formula: Tn = Rn +
          Sn", where "Rn = the total amount payable as income-tax and surcharge,
          if applicable, on an amount as specified in column C" -- the threshold
          the income has just crossed -- and "Sn = the total income - amount as
          specified in column C". So the ceiling is the tax and surcharge at the
          threshold plus every rupee earned above it, and the relief is whatever
          the surcharge has to give up to reach that ceiling. Note what the
          ceiling covers: income-tax and surcharge, and not the cess charged on
          them, which the Finance Act imposes separately at section 3(15). A
          rupee of salary above the threshold therefore still costs the cess on
          its own rupee of tax.
      old_regime:
        title: The Finance Act, 2026 (No. 4 of 2026)
        section: 'Finance Act, 2026 (No. 4 of 2026), First Schedule, Part I-B, Paragraph F, the passage following Table 1, and Table 2, Sl. No. 1 ("Table 1: Sl. No. 1.B")'
        source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
        retrieved: 2026-09-05
        note: >-
          "the total amount payable as income-tax and surcharge thereon shall not
          exceed the amount determined as per the following formula: Wn = Un +
          Vn", where "Un = the total amount payable as income-tax and surcharge,
          if applicable, on an amount as specified in column C of the Table 2
          below" -- the threshold the income has just crossed -- and "Vn = the
          total income - amount as specified in column C". The same rule as the
          new regime's at section 3(5), under different letters, and the same
          limit on it: the ceiling covers income-tax and surcharge, not the cess
          charged on them at section 3(15), so a rupee of salary above the
          threshold still costs the cess on its own rupee of tax.
    cess:
      title: The Finance Act, 2026 (No. 4 of 2026)
      section: Finance Act, 2026 (No. 4 of 2026), section 3(15) ("Health and Education Cess on income-tax")
      source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
      retrieved: 2026-09-05
      note: >-
        Charged on the income-tax as increased by the applicable surcharge, and
        so on the tax remaining after any rebate. Imposed by the annual Finance
        Act rather than by the Income-tax Act: it must be re-sourced each year.
      rate: 0.04

  # The Income-tax Act, 2025 rounds with ONE section where the 1961 Act had two,
  # and it rounds tax to the nearest ten rupees, not to the nearest rupee. The
  # two entries below are two applications of that single section, kept apart
  # because they are applied at two different points in the computation.
  statutory_rounding:
    title: The Income-tax Act, 2025 (No. 30 of 2025)
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    total_income:
      section: Income-tax Act, 2025, section 516 ("Rounding off of amount of total income, or amount payable or refundable")
      source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
      retrieved: 2026-09-05
      note: >-
        "rounded off to the nearest multiple of 10 ignoring any part of a rupee
        consisting of paise and thereafter if such amount is not a multiple of
        ten" -- increased if the last figure is five or more, reduced if it is
        less than five. Dropping the paise first and rounding the whole-rupee
        figure on its last digit gives the same answer as rounding the exact
        amount half upward, because the paise can only decide the outcome at an
        exact rupee ending in five, where both readings round up.
      unit_rupees: 10
    tax_payable:
      section: Income-tax Act, 2025, section 516 ("Rounding off of amount of total income, or amount payable or refundable")
      source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
      retrieved: 2026-09-05
      note: >-
        The same section and the same unit: "any amount payable or refundable
        under this Act" rounds to the nearest ten rupees. The 1961 Act's section
        288B rounded tax to the nearest rupee; the 2025 Act carries no such
        provision, and a search of its full text finds no other rounding rule
        outside the tonnage-tax chapter.
      unit_rupees: 10

  # Employees' provident fund: the employee's own share, and the employer's.
  #
  # Which statute applies here is not obvious and was checked rather than
  # assumed. The four Labour Codes commenced on 21 November 2025, and the Code
  # on Social Security, 2020 would on full commencement repeal the 1952 Act and
  # fix the contribution itself. It has not: notification S.O. 5319(E) of
  # 21 November 2025 commenced only part of the Code, and left out both section
  # 16(1)(a), the provident fund contribution rate, and item 3 of section
  # 164(1), the repeal of the 1952 Act. So for tax year 2026-27 the Employees'
  # Provident Funds and Miscellaneous Provisions Act, 1952 still governs.
  # S.O. 5319(E): https://egazette.gov.in/WriteReadData/2025/267882.pdf
  #
  # Three figures below carry a `note` recording that their operative instrument
  # could not be retrieved. Read those notes before quoting the figures.
  epf:
    title: The Employees' Provident Funds and Miscellaneous Provisions Act, 1952 (No. 19 of 1952)
    source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
    retrieved: 2026-09-05
    # NOT sourced to the instrument that fixes it. `title` names the paper
    # `source` actually is -- a Ministry statement, not the Act -- and `section`
    # names the passage inside it, so neither pretends to be the provision; the
    # note says what the provision itself says instead.
    employee_rate:
      title: Ministry of Labour and Employment, reply to Lok Sabha Unstarred Question No. 586, 24 July 2023 (PIB release 1942083)
      section: The paragraph beginning "Under the EPF, Scheme, 1952, an employee of any covered establishment"
      source: https://www.labour.gov.in/static/uploads/2025/06/93561f36d5094b0cfe52570b4e8d2dc1.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before quoting the figure. Section 6 of the Employees'
        Provident Funds and Miscellaneous Provisions Act, 1952 says the
        contribution is TEN per cent; its first proviso substitutes 12 per cent
        only for establishments the Central Government has notified, and that
        notification could not be retrieved -- epfindia.gov.in and epfo.gov.in
        refuse requests from this environment. So 0.12 is not the rate read off
        the section. It is the rate the Government states is applied: an
        employee of a covered establishment "is statutorily required to join the
        fund and to contribute 12% of wages". That statement is accepted as the
        basis here rather than the figure being withheld, and this note is
        permanent rather than provisional -- ADR 0019 gives the reasoning and the
        four conditions it depends on. Treat any figure computed from this rate
        as resting on the Ministry's statement rather than on the Act.
      rate: 0.12
    # Also NOT sourced to the instrument that fixes it; same caveat. The Act
    # fixes the employer's share in the same sentence as the employee's, and its
    # proviso substitutes 12 per cent in both places at once, so the two rates
    # stand or fall together.
    employer_rate:
      title: Ministry of Labour and Employment, reply to Lok Sabha Unstarred Question No. 586, 24 July 2023 (PIB release 1942083)
      section: The paragraph beginning "Under the EPF, Scheme, 1952, an employee of any covered establishment"
      source: https://www.labour.gov.in/static/uploads/2025/06/93561f36d5094b0cfe52570b4e8d2dc1.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before quoting the figure, and read `employee_rate`'s note
        with it: the same caveat applies for the same reason. Section 6 says
        "The contribution which shall be paid by the employer to the Fund shall
        be ten percent. Of the basic wages, dearness allowance and retaining
        allowance, if any", and its first proviso substitutes "12 percent" for
        notified establishments "at both the places where they occur" -- that
        notification could not be retrieved. So 0.12 is the rate the Government
        states is applied, not the rate read off the section: "The employer is
        also required to contribute 12% of the wages." That statement is
        accepted as the basis here, permanently, on the reasoning in ADR 0019.
        This is the WHOLE employer share. Section 6A(2)(a) diverts part of it to
        the Employees' Pension Scheme, but the Act fixes only a ceiling on that
        part -- "not exceeding eight and one-third per cent of the basic wages,
        dearness allowance and retaining allowance" -- and leaves the figure
        itself to "as may be specified in the Pension Scheme", which could not
        be retrieved. The split is therefore not carried here, and a figure
        computed from this rate is the employer's total contribution rather than
        what reaches the provident fund alone.
      rate: 0.12
    # Also NOT sourced to the instrument that fixes it; same caveat.
    wage_ceiling:
      title: Ministry of Labour and Employment, reply to Lok Sabha Unstarred Question No. 586, 24 July 2023 (PIB release 1942083)
      section: The paragraph beginning "The wage ceiling for coverage under the EPF Scheme, 1952"
      source: https://www.labour.gov.in/static/uploads/2025/06/93561f36d5094b0cfe52570b4e8d2dc1.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before quoting the figure. "The wage ceiling for coverage
        under the EPF Scheme, 1952 is revised from time to time. Presently, it
        is Rs.15000/- per month since 01.09.2014." Section 6 of the Act carries
        no ceiling at all -- it lives in the Employees' Provident Fund Scheme,
        1952, whose consolidated text could not be retrieved, and the 2014
        notification that set it could not be retrieved either. This is the
        Government's statement of the figure, not the instrument that fixed it,
        and it is accepted as the basis here, permanently, on the reasoning in
        ADR 0019.
      monthly_rupees: 15000
    wage_components:
      section: Employees' Provident Funds and Miscellaneous Provisions Act, 1952, sections 2(b) and 6
      source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
      retrieved: 2026-09-05
      note: >-
        Section 6 computes the contribution on "basic wages, dearness allowance
        and retaining allowance", and section 2(b)(ii) excludes house rent
        allowance from basic wages by name, along with overtime, bonus and
        commission. Of the catalogue's entries only `basic` is inside that base;
        this file carries no dearness or retaining allowance entry yet, and a
        ticket adding one must add it here too. Whether a "special allowance"
        falls inside section 2(b) has been litigated and is not settled by the
        section's own words, so it is left out rather than guessed at.
      entries:
        - basic

  # Which catalogue entries are basic pay (spec #7). Basic is a head of wages in
  # its own right, not a residual: section 2(y) of the Code on Wages lists what
  # wages include as "(i) basic pay; (ii) dearness allowance; and (iii) retaining
  # allowance, if any", three separate heads. The decoder never names a component
  # type in code (ADR 0004), so which of this file's catalogue entries is basic
  # pay is stated here.
  basic_pay:
    title: The Code on Wages, 2019 (No. 29 of 2019)
    source: https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf
    retrieved: 2026-09-05
    catalogue_entries:
      section: The Code on Wages, 2019 (No. 29 of 2019), section 2(y)(i)
      source: https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf
      retrieved: 2026-09-05
      note: >-
        Section 2(y) defines wages and lists what they include: "(i) basic pay;
        (ii) dearness allowance; and (iii) retaining allowance, if any". Basic
        pay is the first of the three and is its own head, distinct from the
        other two. Of this file's catalogue entries only `basic` is basic pay; a
        dearness or retaining allowance entry added to the catalogue is a
        different head of wages and does not belong here, even though the two
        share a base with basic pay under the provident fund and gratuity Acts.
      entries:
        - basic

  # Gratuity: what basic drives on termination of employment (spec #7). Only the
  # accrual formula, the qualifying service period and the wage base are carried;
  # this file computes no gratuity figure.
  #
  # The retrieved consolidation is not fully current. Its section 4(3) still
  # states the ceiling on gratuity payable as ten lakh rupees, a figure later
  # amendments raised, and no primary text of the amendment could be retrieved
  # from this environment. No ceiling is therefore encoded here, and none may be
  # added from memory. The three values below are unaffected: none of them has
  # been amended in the text retrieved, and each is quoted in its own note.
  gratuity:
    title: The Payment of Gratuity Act, 1972 (No. 39 of 1972)
    source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
    retrieved: 2026-09-05
    accrual:
      section: The Payment of Gratuity Act, 1972, section 4(2) and its Explanation
      source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
      retrieved: 2026-09-05
      note: >-
        "For every completed year of service or part thereof in excess of six
        months, the employer shall pay gratuity to an employee at the rate of
        fifteen days' wages based on the rate of wages last drawn by the
        employee concerned." The Explanation fixes the divisor: "In the case of
        a monthly rated employee, the fifteen days' wages shall be calculated by
        dividing the monthly rate of wages last drawn by him by twenty-six and
        multiplying the quotient by fifteen." Two provisos to the same
        sub-section put a piece-rated and a seasonal employee outside this
        formula, and neither is encoded here.
      days_of_wages: 15
      days_in_month: 26
    qualifying_service:
      section: The Payment of Gratuity Act, 1972, section 4(1)
      source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
      retrieved: 2026-09-05
      note: >-
        "Gratuity shall be payable to an employee on the termination of his
        employment after he has rendered continuous service for not less than
        five years" -- on superannuation, on retirement or resignation, or on
        death or disablement. The first proviso waives the five years where the
        termination is due to death or disablement, so the period bounds a
        resignation and not every ending of the employment.
      years: 5
    wage_components:
      section: The Payment of Gratuity Act, 1972, section 2(s)
      source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
      retrieved: 2026-09-05
      note: >-
        '"wages" means all emoluments which are earned by an employee while on
        duty or on leave in accordance with the terms and conditions of his
        employment and which are paid or are payable to him in cash and includes
        dearness allowance but does not include any bonus, commission, house
        rent allowance, overtime wages and any other allowance.' Of this file's
        catalogue entries only `basic` is inside that base -- house rent
        allowance is excluded by name, and a special allowance by the closing
        words -- and a dearness allowance entry added to the catalogue must be
        added here too.
      entries:
        - basic

  # House rent allowance: what the Act settles about the exemption, and what it
  # leaves to be prescribed (spec #7). No HRA figure is computed anywhere in this
  # repository, and this group carries no amount, rate or percentage, because the
  # Act carries none.
  hra:
    title: The Income-tax Act, 2025 (No. 30 of 2025)
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    exemption:
      section: Income-tax Act, 2025, Schedule III (see section 11), Table Sl. No. 11 ("Any special allowance from employer"), read with section 202(2)(a)(i)
      source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before saying anything about HRA. Schedule III excludes from
        total income "any special allowance from employer" where "such allowance
        is specifically granted to meet expenditure actually incurred on payment
        of rent (by whatever name called) in respect of residential
        accommodation occupied by the assessee", the accommodation "is not owned
        by him", and he "has actually incurred expenditure on payment of rent".
        HOW MUCH is exempt is not in the Act. Condition (b) of the same entry
        reads "such allowance is to such extent as may be prescribed having
        regard to the area or place in which such accommodation is situated and
        other relevant considerations", so the limbs of the exemption -- and the
        definition of "salary" that decides whether basic bounds it -- live in
        the rules prescribed under the Act, not in the Act. No primary text of
        those rules could be retrieved: incometaxindia.gov.in refuses requests
        from this environment. This file therefore states that the exemption
        exists and is bounded by a prescribed extent, and does not state the
        bound; a figure for it cannot be computed from this file.
        Section 202(2)(a)(i) excludes Schedule III Table Sl. No. 11 from the
        computation of total income by name, so the exemption is the old
        regime's alone.

  # What the Income-tax Act says about equity a company hands its employees
  # (spec #8). Nothing here is computed from: the group carries the statement
  # that the value is a perquisite, and the provisions that make it one, so a
  # grant the decoder has valued -- at grant-date fair market value, or at nil --
  # can be reported with its tax treatment beside it.
  #
  # One clause covers all three instruments, and they differ only in what the
  # employee pays: nothing for a restricted stock unit, the strike for an option,
  # the discounted price under a purchase plan. Section 17(1)(d) counts "the
  # value of any specified security or sweat equity shares allotted or
  # transferred, directly or indirectly, by the current employer, or former
  # employer, free of cost or at concessional rate to the assessee", and section
  # 17(4)(h) measures that value as fair market value less what the employee
  # actually paid.
  #
  # Two limits bind every entry below, and each entry's note repeats them because
  # a reader quoting one figure will not have read the others. The Act's
  # measuring date is the date an option is exercised, which a restricted stock
  # unit has none of; and "fair market value" is "the value determined in
  # accordance with the method, as may be prescribed" (section 17(4)(a)), whose
  # prescribed rules could not be retrieved. No figure of the perquisite is
  # computable from this file, and none is computed anywhere in this repository.
  perquisite:
    title: The Income-tax Act, 2025 (No. 30 of 2025)
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    equity:
      rsu:
        statement: >-
          Shares delivered under a restricted stock unit grant are a specified
          security allotted to the employee free of cost, so their value is a
          perquisite under section 17(1)(d). Section 16(e) makes a perquisite
          part of "salary" and section 15(1) charges salary to income-tax under
          the head "Salaries", so the value enters total income for the tax year
          and bears the same rates as the rest of the salary. The gain on a later
          sale is a separate charge under the head "Capital gains", computed from
          a cost of acquisition that is the same fair market value.
        section: Income-tax Act, 2025, section 17(1)(d), read with sections 16(e), 15(1), 17(4)(f), 17(4)(h) and 73(1) Table Sl. No. 4
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Section 17(1)(d) counts "the value of any specified security or sweat
          equity shares allotted or transferred, directly or indirectly, by the
          current employer, or former employer, free of cost or at concessional
          rate to the assessee". Section 17(4)(f) defines "specified security" by
          reference to section 2(h) of the Securities Contracts (Regulation) Act,
          1956, and adds that "where employees' stock option has been granted
          under any plan or scheme therefor, includes the securities offered
          under such plan or scheme". Section 16 reads '"salary" includes ...
          (e) perquisites', and section 15(1)(a) charges "any salary due from an
          employer to an assessee in the tax year, whether paid or not". Section
          73(1), Table Sl. No. 4, deems the cost of acquisition of a specified
          security referred to in section 17(1)(d) to be the "Fair market value
          taken into account for the purposes of the said clause", which is what
          keeps the perquisite and the later capital gain from being charged on
          the same amount twice. Two things the Act does not settle. Section
          17(4)(h) fixes the value "on the date on which the option is exercised
          by the assessee, as reduced by the amount actually paid by, or
          recovered from, the assessee" -- a restricted stock unit carries no
          option to exercise, so the Act's own words do not name the date for a
          unit that simply vests and is allotted. And section 17(4)(a) leaves
          "fair market value" to "the value determined in accordance with the
          method, as may be prescribed"; no primary text of those prescribed
          rules could be retrieved, because incometaxindia.gov.in refuses
          requests from this environment. A figure for the perquisite therefore
          cannot be computed from this file.
      option:
        statement: >-
          Shares acquired by exercising an employee stock option are a specified
          security transferred at a concessional rate, so the amount by which
          their fair market value on the date of exercise exceeds the strike
          price actually paid is a perquisite under section 17(1)(d), measured by
          section 17(4)(h). Section 16(e) makes a perquisite part of "salary" and
          section 15(1) charges salary to income-tax under the head "Salaries",
          so that excess enters total income for the tax year and bears the same
          rates as the rest of the salary. The gain on a later sale is a separate
          charge under the head "Capital gains", computed from a cost of
          acquisition that is the same fair market value.
        section: Income-tax Act, 2025, section 17(1)(d), read with sections 16(e), 15(1), 17(4)(e), 17(4)(f), 17(4)(h) and 73(1) Table Sl. No. 4
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Section 17(4)(e) defines "option" as "a right but not an obligation,
          granted to an employee to apply for the specified security or sweat
          equity shares at a predetermined price", and section 17(4)(h) fixes the
          amount: "the value of any specified security or sweat equity shares
          shall be the fair market value of the specified security or sweat
          equity shares, on the date on which the option is exercised by the
          assessee, as reduced by the amount actually paid by, or recovered from,
          the assessee in respect of such security or shares." The charge
          therefore falls on exercise and not on vesting, and it falls on the
          spread rather than on the whole value of the shares. Section 73(1),
          Table Sl. No. 4, deems the cost of acquisition to be the "Fair market
          value taken into account for the purposes of the said clause". What the
          Act does not settle is the fair market value itself: section 17(4)(a)
          leaves it to "the value determined in accordance with the method, as
          may be prescribed", and no primary text of those prescribed rules could
          be retrieved, because incometaxindia.gov.in refuses requests from this
          environment. A figure for the perquisite therefore cannot be computed
          from this file, and neither the fair market value on a future exercise
          date nor the date itself is knowable from an offer letter.
      espp:
        statement: >-
          Shares bought under an employee share purchase plan are a specified
          security allotted at a concessional rate, so the discount -- fair
          market value less the price the employee actually paid -- is a
          perquisite under section 17(1)(d), measured by section 17(4)(h).
          Section 16(e) makes a perquisite part of "salary" and section 15(1)
          charges salary to income-tax under the head "Salaries", so the discount
          enters total income for the tax year and bears the same rates as the
          rest of the salary. The purchase price itself is the employee's own
          money and is not income; the gain on a later sale is a separate charge
          under the head "Capital gains".
        section: Income-tax Act, 2025, section 17(1)(d), read with sections 16(e), 15(1), 17(4)(f), 17(4)(h) and 73(1) Table Sl. No. 4
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Section 17(1)(d) reaches a security allotted or transferred "at
          concessional rate" as well as one given free of cost, and section
          17(4)(h) measures the value as fair market value "as reduced by the
          amount actually paid by, or recovered from, the assessee in respect of
          such security or shares" -- so under a purchase plan it is the discount
          alone that is the perquisite, and the price the employee paid is not.
          Section 73(1), Table Sl. No. 4, deems the cost of acquisition to be the
          "Fair market value taken into account for the purposes of the said
          clause", so the amount already charged as a perquisite is not charged
          again on sale. What the Act does not settle is the fair market value:
          section 17(4)(a) leaves it to "the value determined in accordance with
          the method, as may be prescribed", and no primary text of those
          prescribed rules could be retrieved, because incometaxindia.gov.in
          refuses requests from this environment. A figure for the discount
          therefore cannot be computed from this file, which is a separate reason
          from the one that holds a purchase plan at nil in the decoder: the
          employee funds the purchase out of pay the package already counts.
