# Statutory rules for financial year 2026-27 (assessed in AY 2027-28).
#
# Shape (ADR 0001, ADR 0008):
#   financial_year: the FY this file covers; must match the filename.
#   groups:         a map of named groups. Every value lives inside a group,
#                   and every group carries `source` (primary-source URL) and
#                   `retrieved` (YYYY-MM-DD), plus optional `effective_from`
#                   and `effective_to` dates.
#
# Rates are written as decimal fractions (`rate: 0.05`, never `500`) under a
# key named `rate` or ending in `_rate`; the loader converts them to integer
# basis points and refuses more precision than basis points can hold (ADR 0002).
#
# Groups are added by the ticket that sources them.
financial_year: 2026-27
groups:
  # The catalogue of offer-letter component types (ADR 0004). Each entry
  # classifies a component on the two axes -- `certainty` (guaranteed /
  # conditional-on-performance / conditional-on-tenure / conditional-on-liquidity)
  # and `form` (cash-now / deferred-cash / locked-savings / equity /
  # benefit-in-kind) -- plus a `recurring` flag, and `instrument` for an equity
  # type. Guaranteed recurring cash is derived from the first three (guaranteed
  # and cash-now and recurring), never listed here.
  #
  # Adding a component type is a change to this group alone; the decoder
  # classifies whatever entries it finds.
  #
  # The group's source is what names these components as parts of a pay packet:
  # section 2(y) of the Code on Wages defines wages and lists what an employer
  # pays beside them -- house rent allowance, a travelling concession, bonus,
  # commission, gratuity, and the employer's contribution to a provident or
  # pension fund. It does not settle where any of them sits on the two axes, so
  # every entry states its own basis and none inherits this one (ADR 0010):
  # `source` when a statute settles the classification, `rationale` when the
  # author does.
  components:
    title: The Code on Wages, 2019 (No. 29 of 2019), section 2(y)
    source: https://www.labour.gov.in/static/uploads/2025/06/c328da14bbb15fc4ad571dc33e7a4ab3.pdf
    retrieved: 2026-09-05
    entries:
      basic:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          The base component of the salary structure, payable monthly under the
          terms of employment whatever the employee or the employer achieves.
      hra:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          Paid with monthly salary as part of the fixed structure. Its exemption
          from tax is conditional on rent paid; the payment itself is not.
      special_allowance:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          The residual monthly allowance that balances a structure to its agreed
          fixed pay, and is paid unconditionally like the rest of it.
      lta:
        certainty: guaranteed
        form: cash-now
        recurring: true
        rationale: >-
          Budgeted in the annual fixed structure and paid to the employee whether
          or not it is claimed against travel, being taxable when unclaimed. The
          travel and the bills condition the exemption, not the payment.
      # Sections 5 and 6: the employer's contribution is paid into a fund framed
      # under the Act, not to the employee, so it is savings the employee cannot
      # reach now.
      employer_pf:
        certainty: guaranteed
        form: locked-savings
        recurring: true
        title: The Employees' Provident Funds and Miscellaneous Provisions Act, 1952 (No. 19 of 1952)
        source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
      # Section 4(1): gratuity is payable only on termination of employment, and
      # only after not less than five years of continuous service -- conditional
      # on tenure, and deferred until the employment ends.
      gratuity:
        certainty: conditional-on-tenure
        form: deferred-cash
        recurring: true
        title: The Payment of Gratuity Act, 1972 (No. 39 of 1972), section 4(1)
        source: https://www.labour.gov.in/static/uploads/2025/06/072a4b7ea8246533c62b96b68a30da53.pdf
      # Section 2(i): the National Pension System accumulates contributions in an
      # individual pension account, so an employer contribution to it is savings
      # rather than cash the employee receives.
      employer_nps:
        certainty: guaranteed
        form: locked-savings
        recurring: true
        title: The Pension Fund Regulatory and Development Authority Act, 2013 (No. 23 of 2013), section 2(i)
        source: https://www.pfrda.org.in/documents/33652/103065/PFRDA+Act+-+2013.pdf
      variable_pay:
        certainty: conditional-on-performance
        form: cash-now
        recurring: true
        rationale: >-
          Quoted at a target and paid against an assessment of performance, so
          neither its occurrence nor its amount is settled by the letter. It is
          offered each year, and it is cash in the year it is paid.
      joining_bonus:
        certainty: guaranteed
        form: cash-now
        recurring: false
        rationale: >-
          Promised unconditionally for joining, paid in cash, and paid once.
      relocation:
        certainty: guaranteed
        form: cash-now
        recurring: false
        rationale: >-
          Paid or reimbursed once for the move itself, and not repeated in later
          years.
      retention_bonus:
        certainty: conditional-on-tenure
        form: cash-now
        recurring: false
        rationale: >-
          Paid once, and only if the employee is still in service on the date the
          letter names.
      insurance_premium:
        certainty: guaranteed
        form: benefit-in-kind
        recurring: true
        rationale: >-
          A premium the employer pays to an insurer every year. The employee
          receives cover, and never the money.
      meal_card:
        certainty: guaranteed
        form: benefit-in-kind
        recurring: true
        rationale: >-
          Loaded each month onto an instrument that can only be spent on meals,
          so the employee receives a benefit rather than cash.

  # Income tax under the new regime, for tax year 2026-27.
  #
  # The Income-tax Act, 2025 (No. 30 of 2025) came into force on 1 April 2026
  # and repealed the Income-tax Act, 1961 (section 536(1)), so the section
  # numbers CONTEXT.md's glossary grew up with -- 115BAC, 87A, 16(ia), 288A,
  # 288B -- name a repealed Act and appear nowhere in this file.
  #
  # Two Acts are in play and the split is not the obvious one. The *rate table*
  # for the new regime lives in the Income-tax Act itself (section 202(1)); the
  # Finance Act, 2026 only charges tax "at the rates specified" and carries the
  # OLD regime's table in Part I-B of its First Schedule. The cess, by contrast,
  # is imposed by the Finance Act and must be re-sourced every year.
  income_tax:
    title: The Income-tax Act, 2025 (No. 30 of 2025), as charged for tax year 2026-27 by the Finance Act, 2026 (No. 4 of 2026)
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    new_regime:
      slabs:
        section: Income-tax Act, 2025, section 202(1) Table ("New tax regime for individuals, Hindu undivided family and others")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Charged for tax year 2026-27 by the Finance Act, 2026, section 3(1),
          which refers to these rates rather than restating them. Finance Act,
          2026, section 56 is its only amendment to section 202 and touches
          sub-section (2)(a)(iii) alone, leaving this table untouched. The Act
          states the table as band and rate without spelling out the marginal
          arithmetic; it is read as a slab table, which is how the Income Tax
          Department's own calculation engine applies it.
        bands:
          - upto: 400000
            rate: 0.00
          - upto: 800000
            rate: 0.05
          - upto: 1200000
            rate: 0.10
          - upto: 1600000
            rate: 0.15
          - upto: 2000000
            rate: 0.20
          - upto: 2400000
            rate: 0.25
          # Sl. No. 7, "Above 24,00,000": the final band has no upper bound.
          - rate: 0.30
      standard_deduction:
        section: Income-tax Act, 2025, section 19(1) Table Sl. No. 2(a) ("Deductions from salaries")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          "75000 or the salary, whichever is less, where income-tax is computed
          under section 202(1)" -- so it is capped at the salary it is deducted
          from. Section 202(2)(a) disallows only Sl. No. 1 of the same table,
          which is the tax on employment, so the standard deduction survives in
          the new regime.
        amount: 75000
      rebate:
        section: Income-tax Act, 2025, section 156(2) and (3) ("Rebate of income-tax in case of certain individuals")
        source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
        retrieved: 2026-09-05
        note: >-
          Available to a resident individual only. Section 156(2)(b) also gives
          marginal relief where total income exceeds twelve lakh rupees, which
          this decoder does not yet compute, so the figures above the threshold
          are the pre-relief ones.
        total_income_threshold: 1200000
        maximum: 60000
    cess:
      section: Finance Act, 2026 (No. 4 of 2026), section 3(15) ("Health and Education Cess on income-tax")
      source: https://egazette.gov.in/WriteReadData/2026/271439.pdf
      retrieved: 2026-09-05
      note: >-
        Charged on the income-tax as increased by the applicable surcharge, and
        so on the tax remaining after any rebate. Imposed by the annual Finance
        Act rather than by the Income-tax Act: it must be re-sourced each year.
      rate: 0.04

  # The Income-tax Act, 2025 rounds with ONE section where the 1961 Act had two,
  # and it rounds tax to the nearest ten rupees, not to the nearest rupee. The
  # two entries below are two applications of that single section, kept apart
  # because they are applied at two different points in the computation.
  statutory_rounding:
    title: The Income-tax Act, 2025 (No. 30 of 2025), section 516
    source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
    retrieved: 2026-09-05
    effective_from: 2026-04-01
    total_income:
      section: Income-tax Act, 2025, section 516 ("Rounding off of amount of total income, or amount payable or refundable")
      source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
      retrieved: 2026-09-05
      note: >-
        "rounded off to the nearest multiple of 10 ignoring any part of a rupee
        consisting of paise and thereafter if such amount is not a multiple of
        ten" -- increased if the last figure is five or more, reduced if it is
        less than five. Dropping the paise first and rounding the whole-rupee
        figure on its last digit gives the same answer as rounding the exact
        amount half upward, because the paise can only decide the outcome at an
        exact rupee ending in five, where both readings round up.
      unit_rupees: 10
    tax_payable:
      section: Income-tax Act, 2025, section 516 ("Rounding off of amount of total income, or amount payable or refundable")
      source: https://egazette.gov.in/WriteReadData/2025/265620.pdf
      retrieved: 2026-09-05
      note: >-
        The same section and the same unit: "any amount payable or refundable
        under this Act" rounds to the nearest ten rupees. The 1961 Act's section
        288B rounded tax to the nearest rupee; the 2025 Act carries no such
        provision, and a search of its full text finds no other rounding rule
        outside the tonnage-tax chapter.
      unit_rupees: 10

  # Employees' provident fund, employee's own share.
  #
  # Which statute applies here is not obvious and was checked rather than
  # assumed. The four Labour Codes commenced on 21 November 2025, and the Code
  # on Social Security, 2020 would on full commencement repeal the 1952 Act and
  # fix the contribution itself. It has not: notification S.O. 5319(E) of
  # 21 November 2025 commenced only part of the Code, and left out both section
  # 16(1)(a), the provident fund contribution rate, and item 3 of section
  # 164(1), the repeal of the 1952 Act. So for tax year 2026-27 the Employees'
  # Provident Funds and Miscellaneous Provisions Act, 1952 still governs.
  # S.O. 5319(E): https://egazette.gov.in/WriteReadData/2025/267882.pdf
  #
  # Two figures below carry a `note` recording that their operative instrument
  # could not be retrieved. Read those notes before quoting the figures.
  epf:
    title: The Employees' Provident Funds and Miscellaneous Provisions Act, 1952 (No. 19 of 1952)
    source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
    retrieved: 2026-09-05
    # NOT sourced to the instrument that fixes it. `section` names the document
    # `source` actually is, so the two never point at different papers: it is a
    # Ministry statement, not the section, and the note says what the section
    # itself says instead.
    employee_rate:
      section: Ministry of Labour and Employment, reply to Lok Sabha Unstarred Question No. 586, 24 July 2023
      source: https://www.labour.gov.in/static/uploads/2025/06/93561f36d5094b0cfe52570b4e8d2dc1.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before quoting the figure. Section 6 of the Employees'
        Provident Funds and Miscellaneous Provisions Act, 1952 says the
        contribution is TEN per cent; its first proviso substitutes 12 per cent
        only for establishments the Central Government has notified, and that
        notification could not be retrieved -- epfindia.gov.in and epfo.gov.in
        refuse requests from this environment. So 0.12 is not the rate read off
        the section. It is the rate the Government states is applied: an
        employee of a covered establishment "is statutorily required to join the
        fund and to contribute 12% of wages". Re-source it from the notification
        when that becomes reachable, and until then treat any figure computed
        from it as resting on this statement rather than on the Act.
      rate: 0.12
    # Also NOT sourced to the instrument that fixes it; same caveat.
    wage_ceiling:
      section: Ministry of Labour and Employment, reply to Lok Sabha Unstarred Question No. 586, 24 July 2023
      source: https://www.labour.gov.in/static/uploads/2025/06/93561f36d5094b0cfe52570b4e8d2dc1.pdf
      retrieved: 2026-09-05
      note: >-
        Read this before quoting the figure. "The wage ceiling for coverage
        under the EPF Scheme, 1952 is revised from time to time. Presently, it
        is Rs.15000/- per month since 01.09.2014." Section 6 of the Act carries
        no ceiling at all -- it lives in the Employees' Provident Fund Scheme,
        1952, whose consolidated text could not be retrieved, and the 2014
        notification that set it could not be retrieved either. This is the
        Government's statement of the figure, not the instrument that fixed it.
      monthly_rupees: 15000
    wage_components:
      section: Employees' Provident Funds and Miscellaneous Provisions Act, 1952, sections 2(b) and 6
      source: https://www.labour.gov.in/static/uploads/2025/06/03cab9b7485af64f747d8c658cb56a7e.pdf
      retrieved: 2026-09-05
      note: >-
        Section 6 computes the contribution on "basic wages, dearness allowance
        and retaining allowance", and section 2(b)(ii) excludes house rent
        allowance from basic wages by name, along with overtime, bonus and
        commission. Of the catalogue's entries only `basic` is inside that base;
        this file carries no dearness or retaining allowance entry yet, and a
        ticket adding one must add it here too. Whether a "special allowance"
        falls inside section 2(b) has been litigated and is not settled by the
        section's own words, so it is left out rather than guessed at.
      entries:
        - basic
